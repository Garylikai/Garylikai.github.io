<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Kai Li — statistics, reinforcement learning, and data science</title>
  <desc id="desc">A light professional social card with Kai Li's portrait, the Kai's Square mark, and research fields.</desc>

  <defs>
    <clipPath id="portrait-crop">
      <rect x="758" y="119" width="362" height="362"/>
    </clipPath>
  </defs>

  <rect width="1200" height="627" fill="#f8fafb"/>
  <rect width="12" height="627" fill="#2f7d95"/>

  <!-- Quiet geometric texture: a visual echo of Kai's Square. -->
  <g fill="none" stroke="#2f7d95" opacity="0.10">
    <rect x="655" y="28" width="94" height="94"/>
    <rect x="687" y="60" width="94" height="94"/>
    <rect x="1118" y="514" width="54" height="54"/>
    <rect x="1088" y="544" width="54" height="54"/>
  </g>
  <g fill="#2f7d95" opacity="0.12">
    <circle cx="682" cy="551" r="4"/>
    <circle cx="710" cy="551" r="4"/>
    <circle cx="738" cy="551" r="4"/>
    <circle cx="682" cy="579" r="4"/>
    <circle cx="710" cy="579" r="4"/>
    <circle cx="738" cy="579" r="4"/>
  </g>

  <!-- Kai's Square identity mark. -->
  <rect x="72" y="58" width="68" height="68" rx="7" fill="#2f7d95"/>
  <text x="87" y="111" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">K</text>
  <text x="119" y="84" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2</text>
  <text x="160" y="101" fill="#3d4144" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">KAI’S SQUARE</text>

  <text x="72" y="257" fill="#25282a" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700">Kai Li</text>
  <rect x="74" y="288" width="92" height="6" fill="#2f7d95"/>
  <text x="72" y="357" fill="#3d4144" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400">Statistics · Reinforcement Learning</text>
  <text x="72" y="402" fill="#3d4144" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400">Data Science</text>
  <text x="72" y="541" fill="#2f7d95" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">garylikai.github.io</text>

  <!-- Square portrait, framed with the site's teal accent. -->
  <rect x="743" y="104" width="392" height="392" fill="#dbe5e8"/>
  <rect x="750" y="111" width="378" height="378" fill="#2f7d95"/>
  <image x="758" y="119" width="362" height="362" xlink:href="kai-li-portrait.webp" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-crop)"/>
  <rect x="758" y="119" width="362" height="362" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <text x="758" y="528" fill="#6f777d" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.2">RESEARCH · TEACHING · MENTORING</text>
</svg>
